name: Daily Netlify Rebuild

# 網站由 Netlify 部署：推送到 main 時 Netlify 會自己建置，這裡不需要再建置一次。
# 這個流程只負責每天叫 Netlify 重新建置一次，更新 Steam 全成就資料。
# 需要的 Secret：NETLIFY_BUILD_HOOK（Netlify → Site configuration → Build & deploy → Build hooks 產生的網址）

on:
  # 每天自動重新建置一次（UTC 20:00 = 台灣時間 04:00）
  schedule:
    - cron: "0 20 * * *"
  # 允許在 GitHub 的 Actions 分頁手動觸發
  workflow_dispatch:

permissions: {}

jobs:
  trigger-netlify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build hook
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "::error::缺少 NETLIFY_BUILD_HOOK Secret，請到 Settings → Secrets and variables → Actions 新增"
            exit 1
          fi
          curl -fsS -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
